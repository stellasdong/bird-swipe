name: Deploy web app

# Publishes the static web app to GitHub Pages. This is the whole update
# mechanism: researchers reload the page and have the current version. There is
# nothing to download and nothing to install.
#
# One Pages site holds two copies of the app:
#
#   /bird-swipe/        <- the main branch. What researchers use.
#   /bird-swipe/dev/    <- the dev branch. A preview to try things on.
#
# Both are rebuilt from their own branch on every run, whichever branch was
# pushed, so a dev push can never republish a stale main and vice versa.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but don't cancel one in progress either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # The dev branch may not exist yet; the preview is then simply absent.
      - uses: actions/checkout@v4
        id: dev
        continue-on-error: true
        with:
          ref: dev
          path: dev

      - name: Assemble the site
        run: |
          set -euo pipefail

          # $1 = checkout dir, $2 = destination under _site
          assemble() {
            local src="$1" dest="$2"
            mkdir -p "$dest"
            cp -R "$src"/web/. "$dest"/
            # Sample exports, so the deployed test page can run against real data.
            mkdir -p "$dest"/test
            cp -R "$src"/test/. "$dest"/test/
            find "$dest" -name '.DS_Store' -delete
            # Stamp the build so a support question can be pinned to a commit.
            local sha
            sha=$(git -C "$src" rev-parse --short HEAD)
            sed -i "s/__BUILD__/${sha}/" "$dest"/app.js
            echo "Built $dest from $sha"
          }

          assemble main _site
          if [ -d dev/web ]; then
            assemble dev _site/dev
          else
            echo "No dev branch yet — skipping the preview."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
