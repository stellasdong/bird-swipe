name: Deploy web app

# Publishes the static web app to GitHub Pages on every push to main. This is
# the whole update mechanism: researchers reload the page and have the current
# version. There is nothing to download and nothing to install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but don't cancel one in progress either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          # Sample exports, so the deployed test page can run against real data.
          mkdir -p _site/test
          cp -R test/. _site/test/
          find _site -name '.DS_Store' -delete
          # Stamp the build so a support question can be pinned to a commit.
          sha=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD__/${sha}/" _site/app.js
          echo "Built $sha"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
