name: Build apps

# Build the macOS and Windows desktop apps and publish them to a GitHub Release.
#
# The web app at https://stellasdong.github.io/bird-swipe/ is how researchers
# actually run bird-swipe, so this no longer builds on every push: each run
# spent ~4 minutes producing ~640 MB of bundles nobody downloads. It now runs
# only on a version tag, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: bird-swipe-macos
          - os: windows-latest
            artifact: bird-swipe-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        run: pyinstaller packaging/bird_swipe.spec --noconfirm --distpath dist --workpath build/pyi

      # Zip the results so the download is a single file with a clean name.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "bird-swipe.app" "../${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/bird-swipe/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          generate_release_notes: true
          body: |
            ## 📥 Download the app — pick the file for your computer

            | Your computer | Download this file |
            |---------------|--------------------|
            | 🍎 **Mac**     | **`bird-swipe-macos.zip`** |
            | 🪟 **Windows** | **`bird-swipe-windows.zip`** |

            (Both files are listed under **Assets** at the bottom of this page.)

            ### Then open it
            1. Double-click the downloaded `.zip` to unzip it.
            2. **Mac:** the first time, **right-click** `bird-swipe.app` → **Open** → **Open**
               (this clears Apple's "unidentified developer" warning; normal double-click works afterward).
               **Windows:** open the folder and double-click `bird-swipe.exe`; if you see
               "Windows protected your PC", click **More info → Run anyway**.
            3. Click **Open spreadsheet…** and choose your Macaulay Library export (`.csv` or `.xlsx`).

            ---
