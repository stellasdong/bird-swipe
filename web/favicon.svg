<!-- The tab icon. Drawn for 16px, because that is the size it is actually seen
     at — everything here is in service of the silhouette surviving that.

     Two tones only: a warm gradient tile and a white bird. An earlier version
     had a pale wing and a yellow beak, which looked fine at 64px and turned
     into a smudge at 16. So the wing is a notch cut out of the bird in the
     tile's own colour, the beak is a wedge big enough to see, and the bird
     fills the tile instead of floating in the middle of it. The wing is kept
     small on purpose: cut it any deeper and the body reads as a ring rather
     than a bird once it is 16 pixels across.

     A bird because the project has been "Bird Tinder" since the first line of
     PLAN.md — a nod to that, not a copy of anybody's logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="bird-swipe">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff7854"/>
      <stop offset="1" stop-color="#fd267d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#warm)"/>

  <!-- Head, body and tail as one silhouette, filling most of the tile. The
       tail sweeps up to the top-right so the outline is asymmetric — a blob
       with a spike reads as a bird far better than a blob does. -->
  <path fill="#fff"
        d="M25 12.5c-6.6 0-12 5.4-12 12 0 1.6.3 3.1.9 4.5-2.3 3-3.6 6.7-3.6 10.8
           0 4.2 1.6 8 4.3 10.9.9.9 2.4.6 2.9-.6l1.3-3.1c2.7 2.1 6.1 3.4 9.9 3.4
           9.1 0 16.5-7.2 16.9-16.2l8.8-14.9c.8-1.3-.5-2.9-2-2.4l-13.9 4.8
           A11.9 11.9 0 0 0 25 12.5z"/>

  <!-- Beak: a wedge off the left edge of the head, wide enough to read small. -->
  <path fill="#ffc94d" d="M14.6 21.6 2.9 25.3l11 5.6a12 12 0 0 1-.3-9.3z"/>

  <!-- Wing, cut out of the body in the tile's own colour so it is a shape
       rather than a wash. -->
  <path fill="url(#warm)"
        d="M27.8 35.6c4 0 7.5 2.1 9.3 5.3-1.8 3.2-5.3 5.3-9.3 5.3-3.4 0-6.5-1.5-8.4-3.9
           1.8-4 4.8-6.7 8.4-6.7z"/>

  <!-- Eye: a hole, not a dot. Disappears at 16px, which is correct. -->
  <circle cx="22.6" cy="23.2" r="2.6" fill="#e0245e"/>
</svg>
