<!-- The tab icon. Drawn for 16px, because that is the size it is actually seen
     at, but drawn as an actual bird rather than a blob that hints at one.

     What makes a small shape read as a bird is the joints, not the detail: a
     head that sits proud of the body with a dip between them, a beak on the
     horizontal, a tail that leaves the body at an angle, and a wing that
     overlaps rather than floats. Two earlier drafts merged the head into the
     body and swept the tail upward, which turned the whole thing into a chick
     with a quiff.

     A bird because the project has been "Bird Tinder" since the first line of
     PLAN.md — a nod to that, not a copy of anybody's logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="bird-swipe">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ff7854"/>
      <stop offset="1" stop-color="#fd267d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#warm)"/>

  <!-- The bird is drawn at full size and then inset, so the beak and the tail
       do not run into the rounded corners. Easier to read the geometry below
       in round numbers than to shrink every coordinate by hand. -->
  <g transform="translate(32 32) scale(.86) translate(-31.25 -32.5)">

  <!-- Tail first, so the body overlaps its root and it reads as attached.
       Angled down and back: a tail level with the body looks like a fish.
       Tapered from a broad root to a narrow tip, with a shallow fork bitten
       out of the end — a parallel-sided one is a plank, not a tail. The fork
       fills in by 16px and only the taper survives, which is the right thing
       to lose. -->
  <path fill="#fff"
        d="M38.5 31.5c9.5 1 17.4 3.9 23 8.7l-6.2 2.6 3.9 5.6
           c-8.8-1.3-16.1-2.9-21.9-4.8z"/>

  <!-- Body. -->
  <ellipse fill="#fff" cx="32.5" cy="36.5" rx="14.5" ry="11.5"/>

  <!-- Head, set left and high so it stands proud of the body with a dip at
       the neck — that notch is most of what says "bird" at 16px. -->
  <circle fill="#fff" cx="22" cy="21.5" r="10"/>

  <!-- Beak: horizontal wedge off the front of the head. -->
  <path fill="#ffc94d" d="M12.5 18.5 1 23.5 13 27.5Z"/>

  <!-- Wing, overlapping the body in the tile's own colour, tilted along the
       body line rather than sitting flat. -->
  <ellipse fill="url(#warm)" cx="34" cy="37.5" rx="8.5" ry="5.2"
           transform="rotate(-16 34 37.5)"/>

  <!-- Legs. Gone by 16px, which is fine — they are there for the big sizes. -->
  <path stroke="#ffc94d" stroke-width="3" stroke-linecap="round" fill="none"
        d="M28.5 47.5v6M36 47.5v6"/>

  <!-- Eye. -->
  <circle fill="#e0245e" cx="19.5" cy="19.8" r="2.4"/>

  </g>
</svg>
